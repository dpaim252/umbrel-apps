version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dpaim252-mkvtoolnix_server_1
      APP_PORT: 5800

  server:
    image: jlesage/mkvtoolnix:latest
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/home/Downloads:/storage
    restart: on-failure
